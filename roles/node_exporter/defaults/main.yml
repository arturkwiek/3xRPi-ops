---
# Rola działa w dwóch trybach i to jest jej najważniejsza cecha:
#
#   1. ADOPCJA — jeśli binarka już jest, rola jej NIE dotyka. Pilnuje tylko, żeby
#      usługa chodziła i słuchała na :9100. Tak jest na rpi-01 i rpi-03.
#      Nadpisywanie tego byłoby zmianą bez powodu.
#
#      Jak tam trafiła — dwiema roznymi drogami, ustalone 30-08:
#        rpi-01: Z RĘKI, komenda po komendzie. W historii powłoki jest pełny
#                ciąg useradd -> curl -LO -> tar -> cp -> tee jednostki ->
#                systemctl enable --now; binarka datowana 20-06 10:07:22.
#        rpi-03: SKRYPTEM setup_rpi_monitoring.sh. Skrypt leży w ~ z datą
#                11:08, binarka ma 11:10:43, a historia powłoki nie zawiera
#                ANI JEDNEJ komendy monitoringu.
#      Czyli skrypt powstał po ręcznym biegu na rpi-01 i został użyty do
#      postawienia kolejnej płyty. Ta rola jest trzecim ogniwem tego łańcucha.
#
#   2. INSTALACJA — jeśli binarki nie ma, rola stawia ją od zera. Tego brakowało
#      do 30-08 i dlatego site.yml wywalał się na rpi-02.
#
# Parametry instalacji są przepisane z install_node_exporter() ze skryptu, żeby
# maszyna postawiona przez Ansible była nieodróżnialna od tych dwóch zrobionych
# z ręki. To celowe: flota ma być jednorodna, a nie mieć dwa warianty tej samej
# usługi.
#
# JEDNA RÓŻNICA JEST ŚWIADOMA I NA KORZYŚĆ. Ręczny bieg na rpi-01 weryfikował
# sumą kontrolną archiwum Prometheusa (pobrał sha256sums.txt i puścił
# `sha256sum -c -`), ale przy node_exporterze TEGO KROKU NIE BYŁO — samo
# `curl -LO`, `tar`, `cp`. Skrypt tę lukę zamknął funkcją download_and_verify,
# a ta rola idzie tą samą drogą: `checksum: sha256:<base>/sha256sums.txt`.
# Binarka lądująca w /usr/local/bin ma być zweryfikowana, nie pobrana w ciemno.
node_exporter_service: node_exporter
node_exporter_port: 9100

# Instaluj, gdy brakuje. Ustaw na false, jeśli chcesz wyłącznie adopcję
# i wolisz, żeby brak binarki był twardym błędem.
node_exporter_install_missing: true

# Wersja upstream. 1.11.1 chodzi dziś na rpi-01 i rpi-03 — podnoszenie jej tutaj
# NIE zaktualizuje tamtych dwóch, bo rola ich nie dotyka (patrz tryb 1).
node_exporter_version: "1.11.1"

node_exporter_user: node_exporter
node_exporter_bin: /usr/local/bin/node_exporter
node_exporter_unit: /etc/systemd/system/node_exporter.service

node_exporter_release_base: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}

# uname -m  ->  nazwa architektury w nazwie archiwum upstreamu
node_exporter_arch_map:
  aarch64: arm64
  x86_64: amd64
  armv7l: armv7
  armv6l: armv6
node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] | default('arm64') }}"
