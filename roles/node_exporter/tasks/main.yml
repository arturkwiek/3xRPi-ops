---
# node_exporter na :9100 — źródło metryk, które zbiera Prometheus w WSL.
#
# Rola ma dwa tryby, opisane szczegółowo w defaults/main.yml:
#   - binarka JEST  -> nie dotykamy jej, pilnujemy tylko usługi (adopcja),
#   - binarki NIE MA -> stawiamy od zera wg przepisu z setup_rpi_monitoring.sh.
#
# Do 30-08 istniał tylko pierwszy tryb i dlatego site.yml wywalał się na rpi-02,
# która node_exportera nigdy nie miała.

- name: Sprawdź, czy node_exporter jest już zainstalowany
  ansible.builtin.stat:
    path: "{{ node_exporter_bin }}"
  register: node_exporter_binary

- name: Powiedz, w którym trybie działa rola
  ansible.builtin.debug:
    msg: >-
      {{ 'binarka obecna — ADOPCJA, nie ruszam instalacji'
         if node_exporter_binary.stat.exists
         else ('binarki brak — INSTALUJĘ ' ~ node_exporter_version ~ ' (' ~ node_exporter_arch ~ ')'
               if node_exporter_install_missing | bool
               else 'binarki brak, a instalacja wyłączona — to się zaraz wywali') }}

- name: Zatrzymaj się z czytelnym komunikatem, gdy brak binarki i brak zgody na instalację
  ansible.builtin.fail:
    msg: >-
      Na tym hoście nie ma {{ node_exporter_bin }}, a node_exporter_install_missing
      jest false. Ustaw je na true albo zainstaluj usługę ręcznie.
  when:
    - not node_exporter_binary.stat.exists
    - not (node_exporter_install_missing | bool)

- name: Instalacja node_exportera z upstreamu
  when:
    - not node_exporter_binary.stat.exists
    - node_exporter_install_missing | bool
  block:

    - name: Konto systemowe, pod którym chodzi usługa
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Pobierz archiwum i zweryfikuj sumą kontrolną wydania
      # checksum wskazuje na sha256sums.txt z tego samego wydania — Ansible sam
      # znajdzie w nim wiersz pasujący do nazwy pliku. Bez tego pobieralibyśmy
      # binarkę do /usr/local/bin w ciemno.
      ansible.builtin.get_url:
        url: "{{ node_exporter_release_base }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        checksum: "sha256:{{ node_exporter_release_base }}/sha256sums.txt"
        mode: "0644"
      register: node_exporter_download

    - name: Rozpakuj do katalogu tymczasowego
      ansible.builtin.unarchive:
        src: "{{ node_exporter_download.dest }}"
        dest: /tmp
        remote_src: true
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"

    - name: Zainstaluj binarkę
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: "{{ node_exporter_bin }}"
        remote_src: true
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_user }}"
        mode: "0755"
      notify: restart node_exporter

    - name: Jednostka systemd
      # Treść przepisana 1:1 z setup_rpi_monitoring.sh, żeby maszyna postawiona
      # przez Ansible była nieodróżnialna od rpi-01 i rpi-03.
      ansible.builtin.copy:
        dest: "{{ node_exporter_unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_bin }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: Sprzątnij pliki tymczasowe
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

# `daemon_reload` musi pojsc TUTAJ, a nie handlerem: handlery leca na koncu
# play, a swiezo zapisana jednostka musi byc widoczna dla systemd juz teraz —
# inaczej to zadanie nie znajdzie uslugi i bieg konczy sie bledem na maszynie,
# na ktorej wlasnie poprawnie zainstalowalismy binarke.
- name: Usługa node_exporter włączona i uruchomiona
  ansible.builtin.systemd:
    name: "{{ node_exporter_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Potwierdź, że port faktycznie odpowiada
  ansible.builtin.wait_for:
    port: "{{ node_exporter_port }}"
    host: 127.0.0.1
    timeout: 10
