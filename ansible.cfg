[defaults]
inventory           = inventory/hosts.ini
roles_path          = roles
retry_files_enabled = False
interpreter_python  = auto_silent

# New hosts on a trusted LAN — skip the interactive host-key prompt on first
# connect (it would hang a non-interactive run). Flip to True once you trust
# known_hosts / have deployed keys.
host_key_checking   = False

# Klucze wdrozone 2026-08-30 biegiem playbooks/identity.yml na wszystkich trzech
# plytach (znacznik /etc/fleet-identity = v1, authorized_keys po jednej pozycji).
# Zweryfikowane logowaniem z BatchMode=yes, czyli bez mozliwosci cofniecia sie
# do hasla. Od tej pory biegi NIE pytaja juz o haslo SSH.
#
# Powrot do hasla, gdyby klucz przestal dzialac: ask_pass = True i zakomentuj
# private_key_file ponizej. Haslo do konta mwd nadal dziala — rola celowo NIE
# wylaczyla logowania haslem (fleet_disable_password_auth: false), zeby nie
# odciac sie od maszyn bezglowych.
ask_pass            = False
private_key_file    = ~/.ssh/id_ed25519_rpi

[privilege_escalation]
become              = False
become_method       = sudo
# ZOSTAJE WLACZONE, mimo ze klucze juz sa. Sudo jest na tej flocie
# NIESYMETRYCZNE: rpi-01 i rpi-03 maja NOPASSWD:ALL, ale rpi-02 wymaga hasla
# (to plyta z innego obrazu, nigdy nieprowizjonowana recznie). Wylaczenie tego
# zablokowaloby kazdy bieg z `become: true` wlasnie na niej.
#
# UWAGA: ta opcja w ansible.cfg powoduje monit przy KAZDYM wywolaniu, takze
# `ansible rpi -m ping`, ktore w ogole nie uzywa become. Sprawdzone 30-08.
# Po wdrozeniu kluczy zostal wiec JEDEN monit zamiast dwoch, a nie zero.
#
# Alternatywa, gdyby przeszkadzalo: become_ask_pass = False i podawanie -K
# (--ask-become-pass) tylko przy playbookach, ktore eskaluja. Wtedy komendy
# odczytowe ida calkiem bezobslugowo, ale zapomniane -K konczy sie bledem
# "Missing sudo password" na rpi-02. Zostawione na True jako bezpieczniejsze.
become_ask_pass     = True
