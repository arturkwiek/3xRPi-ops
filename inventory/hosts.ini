# RPi fleet — static inventory.
# Auth is by password for now (no SSH keys deployed). See README.md.
#
# ADDRESSES VERIFIED 2026-08-09. The previous entries (.212 / .213 / .145)
# were dead — the fleet had picked up new DHCP leases. A TCP sweep of the
# whole 192.168.0.0/24 for ports 22 and 9100 found exactly two machines
# running node_exporter. Until the router hands out MAC-based reservations
# this will drift again:
#   rpi-01  88:a2:9e:27:38:7a
#   rpi-02  88:a2:9e:27:39:49
#   rpi-03  88:a2:9e:27:2c:be
#
# Both machines currently report the same hostname (MWDRPi) because they were
# cloned from one SD image. Ansible does not care — it addresses them by
# ansible_host — but do not trust `hostname` output to tell them apart.
[rpi]
rpi-01 ansible_host=192.168.0.102
rpi-02 ansible_host=192.168.0.106
# rpi-03 — back on the network as of 2026-08-22 under .151 (it was absent from
# the 2026-08-09 sweep). Identity confirmed by node_exporter: node_uname_info
# reports nodename "RPi-03", so unlike the other two it is not a clone of the
# "MWDRPi" card image.
rpi-03 ansible_host=192.168.0.151
