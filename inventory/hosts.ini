# RPi fleet — static inventory.
# Auth is by password for now (no SSH keys deployed). See README.md.
#
# ADDRESSES VERIFIED 2026-08-29 — fourth DHCP drift, and a card swap.
#   rpi-01  .170  (unchanged since 08-27)
#   rpi-02  ---   BOARD NOT ON THE NETWORK; its SD card is now in rpi-03
#   rpi-03  .100  (was .249 on 08-27)
#
# The card swap matters more than the addresses. The system that used to run
# on rpi-03's card would no longer boot, so rpi-03's board was re-flashed from
# a clone of rpi-02's card. Consequences, all verified on 08-29:
#
#   - The board with MAC 2c:be (physically rpi-03) now reports nodename
#     "MWDRPi" and kernel 7.0.0-1016-raspi, i.e. rpi-02's system, not the
#     "RPi-03" / -1017 it reported on 08-28.
#   - It also presents rpi-02's SSH host key (ED25519 SHA256:ogLBfO5A...),
#     the same key known_hosts already had for .106 and .213 — both former
#     rpi-02 addresses. A dd clone copies /etc/ssh/ssh_host_* verbatim.
#   - So the SSH host key is NOT an identity signal on this fleet, and
#     nodename is now useless for ALL boards, not just two of them.
#
# MAC identifies the BOARD; the card decides what system that board runs.
# The aliases below stay bound to MAC, because that is what is physically
# labelled and what router reservations key on.
#
# WORTH CHECKING: cloned Ubuntu images share /etc/machine-id, and systemd's
# default DHCP DUID is derived from it. Boards that present the same DUID can
# fight over one lease — a plausible root cause for four drifts in a month.
# Fix on the cloned card: regenerate machine-id, SSH host keys and hostname.
#
# PREVIOUS: ADDRESSES VERIFIED 2026-08-27 — third DHCP drift so far:
#   .212/.213/.145  (until 08-09)  ->  .102/.106/.151  (08-09 / 08-22)
#                                  ->  .170/.169/.249  (08-27)
# All three answered a full 192.168.0.0/24 sweep on 2026-08-27 with 22 and
# 9100 open; each one was pinned by its MAC in the ARP table, not by hostname.
#
# ADDRESSES VERIFIED 2026-08-09. The previous entries (.212 / .213 / .145)
# were dead — the fleet had picked up new DHCP leases. A TCP sweep of the
# whole 192.168.0.0/24 for ports 22 and 9100 found exactly two machines
# running node_exporter. Until the router hands out MAC-based reservations
# this will drift again:
#   rpi-01  88:a2:9e:27:38:7a
#   rpi-02  88:a2:9e:27:39:49
#   rpi-03  88:a2:9e:27:2c:be
#
# Both machines currently report the same hostname (MWDRPi) because they were
# cloned from one SD image. Ansible does not care — it addresses them by
# ansible_host — but do not trust `hostname` output to tell them apart.
# RE-VERIFIED 2026-08-30 00:02 — all three boards are on the network again,
# and rpi-02 is no longer running the fleet image at all.
#
#   rpi-01  .170  38:7a  OpenSSH 10.2 (Ubuntu 26.04)  node_exporter up
#   rpi-02  .172  39:49  OpenSSH  9.6 (Ubuntu 24.04)  NOTHING on 9100
#   rpi-03  .100  2c:be  OpenSSH 10.2 (Ubuntu 26.04)  node_exporter up
#
# rpi-02's board came back on a FRESH system, not a clone: its ED25519 host key
# (SHA256:sEEr7qW8De1twHoT+emXu7Zrayo84n7Dk9q87lF0f+U) appears in known_hosts
# for the first time, and its OpenSSH is a whole Ubuntu release behind the
# other two. So the fleet is no longer homogeneous — a baseline run has to cope
# with 24.04 as well as 26.04, and node_exporter is simply not installed there.
#
# rpi-03's board (2c:be) is back under .100 and still runs the CLONE of
# rpi-02's card: host key ogLBfO5A..., nodename "MWDRPi", kernel -1016. It and
# rpi-01 are the two boards roles/identity still needs to individualise.
# rpi-02 does not need machine-id or host-key regeneration — only the hostname
# and the admin key — so consider a host_vars entry turning those two off.
[rpi]
rpi-01 ansible_host=192.168.0.170
rpi-02 ansible_host=192.168.0.172
rpi-03 ansible_host=192.168.0.100
