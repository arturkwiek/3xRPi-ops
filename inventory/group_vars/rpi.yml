---
# Connection settings for the whole fleet.
ansible_user: mwd
ansible_python_interpreter: /usr/bin/python3
# Klucz prywatny jest ustawiony globalnie w ansible.cfg (private_key_file),
# a nie tutaj — dotyczy calej floty, wiec nie ma powodu powtarzac go per grupa.
# Uwierzytelnianie haslem nadal DZIALA jako droga awaryjna: rola identity
# celowo nie wylaczyla PasswordAuthentication.

# --- Nazwy hostow nadawane przez role identity ---
#
# Docelowo: MWDRPi-1 / MWDRPi-2 / MWDRPi-3. Wyliczane z aliasu inwentarza,
# zeby wartosc byla w JEDNYM miejscu i sama sie rozszerzala na kolejne plyty:
#   rpi-01 -> 1,  rpi-02 -> 2,  rpi-03 -> 3,  rpi-10 -> 10
# Wyrazenie zdejmuje przedrostek "rpi-" wraz z wiodacymi zerami.
#
# UWAGA, swiadoma konsekwencja: alias inwentarza (rpi-01) przestaje byc
# identyczny z nazwa hosta (MWDRPi-1). Etykiety `host` w prometheus.yml oraz
# tabela MAC-ow w dokumentacji nadal uzywaja ALIASU — i tak ma zostac, bo to
# one wiaza sie z MAC-iem plyty. Mapowanie: rpi-0N <-> MWDRPi-N.
fleet_hostname: "MWDRPi-{{ inventory_hostname | regex_replace('^rpi-0*', '') }}"
